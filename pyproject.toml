[project]
name = "manga-helper"
version = "0.1.0"
description = "CLI helper tool for manga learning: extract Japanese text, provide hiragana/romaji/English for kanji learning, and clean text areas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Elouie"}]
keywords = ["manga", "ocr", "japanese", "translation", "text-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "pillow>=10.0.0",
    "easyocr>=1.7.0",
    "manga-ocr>=0.1.0",
    "numpy>=1.24.0",
    "kanjiconv>=0.3.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.1.99",
    "torch>=2.0.0",
    "huggingface-hub>=1.24.0",
    "sacremoses>=0.1.0",
    "PySide6>=6.0.0",
]

[project.scripts]
manga-helper = "main:main"
manga-helper-gui = "gui:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
redraw = [
    "lama-cleaner>=0.9.1",
]
